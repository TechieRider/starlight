name: Forbidden Words Check

on:
  pull_request:
    branches: [ "*" ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run forbidden words check
        run: node tools/scripts/check-forbidden-words.js
